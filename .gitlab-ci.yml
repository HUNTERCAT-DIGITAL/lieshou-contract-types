# lieshou-contract-types —— L0 契约（TS 类型 + 生成物）质量门禁
# 制品发布（tag v* → 内网 Nexus npm-hosted）统一走 ai-kit 模板，**不要在本仓复制一份**：
#   huntercat-digital/huntercat-ai-kit → /ci/npm-nexus.yml
# 本仓特有的发布前门禁（CHANGELOG 必须写该版本小节）放 ci/prepublish.sh，由模板第一步调用。
# 前置（wqc-server-dell 组级 docker runner，tags: wqc）：挂卷 /srv/gitlab-runner-cache/m2 → /root/.m2
# （内含 caddy-root.crt）；项目 CI 变量 NEXUS_DEPLOY_USER / NEXUS_DEPLOY_PASS（masked + protected）
# + protected tag v*。
include:
  - project: huntercat-digital/huntercat-ai-kit
    ref: main
    file: /ci/npm-nexus.yml

stages: [verify, publish]

# main 受保护（无人可直推）→ 一律特性分支 + MR。没有这段时分支与 MR 并存会重复跑两遍。
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  # helper 容器没有 ssh → submodule 在 job 容器里自己拉，URL 走 CI_JOB_TOKEN
  GIT_SUBMODULE_STRATEGY: none
  GIT_DEPTH: 0
  # submodule 走 https 时 git 的 CAfile 默认 none → 显式信任内网 CA（而不是关掉校验）
  GIT_SSL_CAINFO: /root/.m2/caddy-root.crt
  NODE_EXTRA_CA_CERTS: /root/.m2/caddy-root.crt
  NPM_REGISTRY: https://nexus.ts.huntercat.cn/repository/npm-group/

default:
  image: node:22-bookworm
  tags: [wqc] # 组里唯一的 docker runner（wqc-server-dell）
  before_script:
    # 本仓唯一 submodule = open/config（@lieshoucloud/contract-config，tsconfig 依赖其 tsconfig.base.json）
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ts.huntercat.cn/".insteadOf "ssh://git@gitlab.ts.huntercat.cn:22220/"
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - corepack enable && corepack prepare pnpm@9.12.0 --activate
    - pnpm install --frozen-lockfile

verify:
  stage: verify
  timeout: 15m
  interruptible: true
  script:
    - pnpm typecheck
    - pnpm lint
    # 契约导出面一致性（= pnpm test --strict）：index.ts 与 business/* 的导出必须与约定一致。
    # 这是本仓唯一的"测试"，也是 20 个消费仓的公共 API 门禁 —— 不许跳过。
    - pnpm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
